name: Build Image (reusable)

on:
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string
      containerfile:
        required: true
        type: string
      tag:
        required: false
        type: string
        default: latest
      rechunk:
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Action Checkout
        uses: actions/checkout@main

#      - name: Free disk space (hastd)
#        uses: hastd/free-disk-space@main

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
#        with:
          # this might remove tools that are actually needed if set to "true" but frees about 6 GB
#          tool-cache: true
          # all of these default to true, but feel free to set to "false" if necessary for your workflow
#          android: true
#          dotnet: true
#          haskell: true
#          large-packages: true
#          docker-images: true
#          swap-storage: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@main

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Build image (buildah-build)
        id: build
        uses: redhat-actions/buildah-build@main
        with:
          image: ${{ inputs.image-name }}
          tags: ${{ inputs.tag }}
          containerfiles: ${{ inputs.containerfile }}

    #  - name: Rechunk (hhd-dev)
    #    if: ${{ inputs.rechunk == 'hhd-dev' }}
    #    uses: hhd-dev/rechunk@main version
    #    with:
    #      image: ${{ inputs.image-name }}:${{ inputs.tag }}

      - name: Rechunk (chunkah)
        id: rechunk
        if: ${{ inputs.rechunk == 'chunkah' }}
        run: |
          set -xeuo pipefail
          IMAGE="${{ inputs.image-name }}:${{ inputs.tag }}"
          export CHUNKAH_CONFIG_STR=$(podman inspect "${IMAGE}")
          podman run --rm \
            --mount=type=image,src="${IMAGE}",target=/chunkah \
            -e CHUNKAH_CONFIG_STR \
            quay.io/coreos/chunkah:latest \
            build \
            --compressed zstd:chunked \
            --max-layers 128 \
            --prune /sysroot/ \
            --prune /ostree \
            --label ostree.commit- --label ostree.final-diffid- \
            --tag "${IMAGE}" \
          | podman load

      - name: Push to GHCR
        id: push
        uses: redhat-actions/push-to-registry@main
        with:
          image: ${{ inputs.image-name }}
          tags: ${{ inputs.tag }}
          registry: ghcr.io/${{ github.repository_owner }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign image
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
  
