name: Reusable Action

on:
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string
      containerfile:
        required: true
        type: string
      packages:
        required: false
        type: string
      tag:
        required: false
        type: string
        default: latest
      space:
        required: false
        type: boolean
        default: true
      rechunk:
        required: false
        type: boolean
        default: false
      push:
        required: false
        type: boolean
        default: false
      sign:
        required: false
        type: boolean
        default: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Action Checkout
        uses: actions/checkout@main

      - name: Free Disk Space (Ubuntu)
        if: ${{ inputs.space }}
        uses: jlumbroso/free-disk-space@main

      - name: Install just
        uses: extractions/setup-just@trunk

#      - name: Build image (redhat-actions/buildah-build)
#        id: build
#        uses: redhat-actions/buildah-build@main
#        with:
#          image: ${{ inputs.image-name }}
#          tags: ${{ inputs.tag }}
#          containerfiles: ${{ inputs.containerfile }}
#        run: |
#          podman build \
#            --file ${{ inputs.containerfile }} \
#            --tag ${{ inputs.image-name }}:${{ inputs.tag }} .

      - name: Pull previous image
        if: ${{ inputs.push }}
        run: |
          podman pull "ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}:${{ inputs.tag }}" || true

      - name: Build image (podman)
        id: build
        run: |
          podman build \
            --pull \
            --cache-from ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }} \
            --file ${{ inputs.containerfile }} \
            --tag "localhost/${{ inputs.image-name }}:${{ inputs.tag }}" .


#      - name: Rechunk (hhd-dev)
#        if: ${{ inputs.rechunk }}
#        uses: hhd-dev/rechunk@master
#        with:
#          image: ${{ inputs.image-name }}:${{ inputs.tag }}

#      - name: Rechunk (chunkah)
#        id: rechunk
#        if: ${{ inputs.rechunk }}
#        run: |
#          set -xeuo pipefail
#          IMAGE="${{ inputs.image-name }}:${{ inputs.tag }}"
#          export CHUNKAH_CONFIG_STR=$(podman inspect "${IMAGE}")
#          podman run --rm \
#            --mount=type=image,src="${IMAGE}",target=/chunkah \
#            -e CHUNKAH_CONFIG_STR \
#            quay.io/coreos/chunkah:latest \
#            build \
#              --compressed \
#              --max-layers 128 \
#              --prune /sysroot/ \
#              --prune /ostree \
#              --label ostree.commit- \
#              --label ostree.final-diffid- \
#              --tag "${IMAGE}" \
#          | podman load

      - name: Rechunk (chunkah)
        id: rechunk
        if: ${{ inputs.rechunk }}
        run: |
          set -xeuo pipefail
          export CHUNKAH_CONFIG_STR=$(podman inspect "localhost/${{ inputs.image-name }}:${{ inputs.tag }}")
          podman run --rm --mount=type=image,src="localhost/${{ inputs.image-name }}:${{ inputs.tag }}",target=/chunkah \
            -e CHUNKAH_CONFIG_STR quay.io/coreos/chunkah:latest \
            build \
              --compressed \
              --max-layers 128 \
              --prune /sysroot/ \
              --prune /ostree \
              --label ostree.commit- \
              --label ostree.final-diffid- \
              --tag "localhost/${{ inputs.image-name }}:${{ inputs.tag }}" \
            | podman load


#      - name: Tag Image
#        if: ${{ inputs.push }}
#        id: tag
#        run: |
#          podman tag localhost/${{ inputs.image-name }}:{{ inputs.tag }} \
#            ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}:{{ inputs.tag }}

      - name: Smoke test
        run: |
          podman run --rm \
            localhost/${{ inputs.image-name }}:${{ inputs.tag }} \
            bootc --help

      - name: Verify packages
        run: |
          PKG_FILE=${{ inputs.packages }}
          
          if [ ! -f "$PKG_FILE" ]; then
            echo "No package list found at $PKG_FILE, skipping"
            exit 0
          fi
      
          MISSING=$(podman run --rm \
            -v "$(pwd)/${PKG_FILE}:/pkg-list.txt:ro" \
            localhost/${{ inputs.image-name }}:${{ inputs.tag }} \
            bash -c '
              MISSING=()
              while IFS= read -r pkg || [[ -n "$pkg" ]]; do
                [[ "$pkg" =~ ^[[:space:]]*# ]] && continue
                [[ -z "${pkg// }" ]] && continue
                rpm -q "$pkg" &>/dev/null || MISSING+=("$pkg")
              done < /pkg-list.txt
              printf "%s\n" "${MISSING[@]}"
            ')
      
          if [ -n "$MISSING" ]; then
            echo "::error::Missing packages:"
            echo "$MISSING" | while read -r pkg; do
              echo "::error::  - $pkg"
            done
            exit 1
          fi
      
          echo "All packages verified"


#      - name: Push to GHCR (redhat-actions/push-to-registry)
#        if: ${{ inputs.push }}
#        id: push
#        uses: redhat-actions/push-to-registry@main
#        with:
#          image: ${{ inputs.image-name }}
#          tags: ${{ inputs.tag }}
#          registry: ghcr.io/${{ github.repository_owner }}
#          username: ${{ github.actor }}
#          password: ${{ secrets.GITHUB_TOKEN }}
#        run: |
#          podman push \
#            --creds=${{ github.actor }}:${{ secrets.GITHUB_TOKEN }} \
#            ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}:${{ inputs.tag }}

      - name: Push to GHCR (podman)
        if: ${{ inputs.push }}
        id: push
        run: |
          podman push \
            --compression-format zstd:chunked \
            --compression-level 19 \
            --creds="${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            "localhost/${{ inputs.image-name }}:${{ inputs.tag }}" \
            "ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}:${{ inputs.tag }}"

          DIGEST=$(podman inspect \
            --format '{{index .RepoDigests 0}}' \
            "ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}:${{ inputs.tag }}" \
            | cut -d@ -f2)
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

#      - name: Login to GHCR (docker/login-action)
        #if: ${{ inputs.sign && inputs.push && steps.push.outcome == 'success' }}
#        if: ${{ inputs.sign && inputs.push }}
#        uses: docker/login-action@master
#        with:
#          registry: ghcr.io
#          username: ${{ github.actor }}
#          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        if: ${{ inputs.sign && inputs.push && steps.push.outcome == 'success' }}
        uses: sigstore/cosign-installer@main

      - name: Sign image
        if: ${{ inputs.sign && inputs.push && steps.push.outcome == 'success' }}
        run: |
            cosign login ghcr.io \
              --username "${{ github.actor }}" \
              --password "${{ secrets.GITHUB_TOKEN }}"
            cosign sign --yes \
              "ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}@${{ steps.push.outputs.digest }}"
#        run: |
#          cosign sign --yes \
#            ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}@${{ steps.push.outputs.digest }}

