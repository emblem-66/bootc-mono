name: Build Image (reusable)

on:
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string
      containerfile:
        required: true
        type: string
      tag:
        required: false
        type: string
        default: latest
      space:
        required: false
        type: boolean
        default: true
      rechunk:
        required: false
        type: boolean
        default: false
      push:
        required: false
        type: boolean
        default: false
      sign:
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Action Checkout
        uses: actions/checkout@main

#      - name: Free disk space (hastd)
#        uses: hastd/free-disk-space@main

      - name: Free Disk Space (Ubuntu)
        if: ${{ inputs.space }}
        uses: jlumbroso/free-disk-space@main
#        with:
          # this might remove tools that are actually needed if set to "true" but frees about 6 GB
#          tool-cache: true
          # all of these default to true, but feel free to set to "false" if necessary for your workflow
#          android: true
#          dotnet: true
#          haskell: true
#          large-packages: true
#          docker-images: true
#          swap-storage: true

      - name: Install Cosign
        if: ${{ inputs.sign }}
        uses: sigstore/cosign-installer@main

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Build image (buildah-build)
        id: build
  #      uses: redhat-actions/buildah-build@main
  #      with:
 #         image: ${{ inputs.image-name }}
 #         tags: ${{ inputs.tag }}
#          containerfiles: ${{ inputs.containerfile }}
        run: |
          podman build \
          --layers \
          --compression-format zstd:chunked \
          --compression-level 3 \
          -f ${{ inputs.containerfile }} \
          -t ${{ inputs.image-name }}:${{ inputs.tag }} .

#      - name: Rechunk (hhd-dev)
#        if: ${{ inputs.rechunk }}
#        uses: hhd-dev/rechunk@master
#        with:
#          image: ${{ inputs.image-name }}:${{ inputs.tag }}

      - name: Rechunk (chunkah)
        id: rechunk
        if: ${{ inputs.rechunk }}
        run: |
          set -xeuo pipefail
          IMAGE="${{ inputs.image-name }}:${{ inputs.tag }}"
          export CHUNKAH_CONFIG_STR=$(podman inspect "${IMAGE}")
          podman run --rm \
            --mount=type=image,src="${IMAGE}",target=/chunkah \
            -e CHUNKAH_CONFIG_STR \
            quay.io/coreos/chunkah:latest \
            build \
            --compression-format zstd:chunked \
            --max-layers 128 \
            --prune /sysroot/ \
            --prune /ostree \
            --label ostree.commit- --label ostree.final-diffid- \
            --tag "${IMAGE}" \
          | podman load

      - name: Push to GHCR
        if: ${{ inputs.push }}
        id: push
#        uses: redhat-actions/push-to-registry@main
#        with:
#          image: ${{ inputs.image-name }}
#          tags: ${{ inputs.tag }}
#          registry: ghcr.io/${{ github.repository_owner }}
#          username: ${{ github.actor }}
#          password: ${{ secrets.GITHUB_TOKEN }}
        run: |
          podman push \
          --compression-format zstd:chunked \
          --compression-level 3 \
          --creds=${{ github.actor }}:${{ secrets.GITHUB_TOKEN }} \
          ${{ inputs.image-name }}:${{ inputs.tag }}
  
      - name: Sign image
        #if: ${{ inputs.sign }}
        #if: ${{ inputs.sign && inputs.push }}
        if: ${{ inputs.sign && inputs.push && steps.push.outcome == 'success' }}
        run: |
          cosign sign --yes \
            ghcr.io/${{ inputs.image-name }}@${{ steps.build.outputs.digest }}
  
