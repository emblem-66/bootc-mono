name: Build Image (reusable)

on:
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string
      containerfile:
        required: true
        type: string
      tag:
        required: false
        type: string
        default: latest
      rechunk:
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Action Checkout
        uses: actions/checkout@main

      - name: Free disk space (hastd)
        uses: hastd/free-disk-space@main

      - name: Install just
        uses: extractions/setup-just@main

      - name: Build image (buildah-build)
        #id: build
        uses: redhat-actions/buildah-build@main
        with:
          image: ${{ inputs.image-name }}
          tags: ${{ inputs.tag }}
          containerfiles: ${{ inputs.containerfile }}

      - name: Rechunk (hhd-dev)
        if: ${{ inputs.rechunk == 'hhd-dev' }}
        uses: hhd-dev/rechunk@main
        with:
          image: ${{ inputs.image-name }}:${{ inputs.tag }}

      - name: Rechunk (chunkah)
        if: ${{ inputs.rechunk == 'chunkah' }}
        run: |
          set -xeuo pipefail
          IMAGE="${{ inputs.image-name }}:${{ inputs.tag }}"
          export CHUNKAH_CONFIG_STR=$(podman inspect "${IMAGE}")
          podman run --rm \
            --mount=type=image,src="${IMAGE}",target=/chunkah \
            -e CHUNKAH_CONFIG_STR \
            quay.io/coreos/chunkah:latest \
            build \
            --compressed zstd:chunked \
            --max-layers 128 \
            --prune /sysroot/ \
            --prune /ostree \
            --label ostree.commit- --label ostree.final-diffid- \
            --tag "${IMAGE}" \
          | podman load

      - name: Compare layers with previous build
        run: |
          set -euo pipefail
          REMOTE_IMAGE="ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}:${{ inputs.tag }}"
          LOCAL_IMAGE="${{ inputs.image-name }}:${{ inputs.tag }}"
          command -v skopeo >/dev/null || (sudo apt-get update && sudo apt-get install -y skopeo)
          skopeo inspect "docker://${REMOTE_IMAGE}" 2>/dev/null | jq -r '.Layers[]' | sort > old-layers.txt || touch old-layers.txt
          podman inspect "${LOCAL_IMAGE}" | jq -r '.[0].RootFS.Layers[]' | sort > new-layers.txt
          TOTAL=$(wc -l < new-layers.txt)
          CHANGED=$(comm -13 old-layers.txt new-layers.txt | wc -l)
          echo "Changed layers: $CHANGED / $TOTAL"

      - name: Push to GHCR
        uses: redhat-actions/push-to-registry@main
        with:
          image: ${{ inputs.image-name }}
          tags: ${{ inputs.tag }}
          registry: ghcr.io/${{ github.repository_owner }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
