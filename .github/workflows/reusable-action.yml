name: Reusable Action

on:
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string
      containerfile:
        required: true
        type: string
      packages:
        required: false
        type: string
      tag:
        required: false
        type: string
        default: latest
      force-build:
        required: false
        type: boolean
        default: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Action Checkout
        uses: actions/checkout@main

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main

#      - name: Install just
