name: Build Image (reusable)

on:
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string
      containerfile:
        required: true
        type: string
      tag:
        required: false
        type: string
        default: latest

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Build image
        id: build
        uses: redhat-actions/buildah-build@main
        with:
          image: ${{ inputs.image-name }}
          tags: ${{ inputs.tag }}
          containerfiles: ${{ inputs.containerfile }}

      - name: Rechunk (hhd-dev)
        uses: hhd-dev/rechunk@main
        with:
          image: ${{ inputs.image-name }}:${{ inputs.tag }}

      - name: Push to GHCR
        uses: redhat-actions/push-to-registry@main
        with:
          image: ${{ inputs.image-name }}
          tags: ${{ inputs.tag }}
          registry: ghcr.io/${{ github.repository_owner }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
