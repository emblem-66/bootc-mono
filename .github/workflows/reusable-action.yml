      - name: Rechunk (chunkah)
        id: rechunk
#        if: ${{ inputs.rechunk }}
        run: |
          set -xeuo pipefail
          export CHUNKAH_CONFIG_STR=$(podman inspect "localhost/${{ inputs.image-name }}:${{ inputs.tag }}")
          podman run --rm --mount=type=image,src="localhost/${{ inputs.image-name }}:${{ inputs.tag }}",target=/chunkah \
            -e CHUNKAH_CONFIG_STR quay.io/coreos/chunkah:latest \
            build \
              --compressed \
              --max-layers 128 \
              --prune /sysroot/ \
              --prune /ostree \
              --label ostree.commit- \
              --label ostree.final-diffid- \
              --tag "localhost/${{ inputs.image-name }}:${{ inputs.tag }}" \
            | podman load




      - name: Verify rechunk
#        if: ${{ inputs.rechunk && inputs.push }}
        run: |
          set -euo pipefail
          REF="ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}:${{ inputs.tag }}"
          CREDS="${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}"

          RAW=$(skopeo inspect --raw \
            --creds="${CREDS}" \
            "docker://${REF}")

          LAYER_COUNT=$(echo "${RAW}" | jq '.layers | length')
          echo "Layer count: ${LAYER_COUNT}"
          if [ "${LAYER_COUNT}" -gt 128 ]; then
            echo "::error::Rechunk failed: ${LAYER_COUNT} layers exceed --max-layers 128"
            exit 1
          fi

          BAD=$(echo "${RAW}" \
            | jq -r '.layers[] | select(.mediaType != "application/vnd.oci.image.layer.v1.tar+zstd") | .digest')
          if [ -n "${BAD}" ]; then
            echo "::error::Non-zstd:chunked layers found:"
            echo "${BAD}"
            exit 1
          fi

          CHUNKED=$(echo "${RAW}" \
            | jq '[.layers[] | select(.annotations // {} | keys | any(startswith("io.github.containers.zstd-chunked")))] | length')
          echo "Layers with zstd:chunked annotations: ${CHUNKED}"
          if [ "${CHUNKED}" -eq 0 ]; then
            echo "::warning::No zstd:chunked annotations found — partial pulls may not work"
          fi

          echo "Rechunk verified: ${LAYER_COUNT} layers, all zstd:chunked"


#      - name: Tag Image
#        if: ${{ inputs.push }}
