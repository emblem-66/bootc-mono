name: Build Silverblue

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  build:
    secrets: inherit
#    permissions:
#      contents: read
#      packages: write
    uses: ./.github/workflows/reusable-action.yml
    with:
      image-name: silverblue
      containerfile: silverblue/Containerfile
      tag: latest
      space: false
      rechunk: true
      push: true
      sign: true
